<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" width="1280" height="360" role="img" aria-label="Zephyr — AI image forensics and multimodal agents">
  <title>Zephyr — AI Image Forensics &amp; Multimodal Agents</title>

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#070b16"/>
      <stop offset="45%"  stop-color="#0d1730"/>
      <stop offset="100%" stop-color="#05080f"/>
    </linearGradient>

    <radialGradient id="glow" cx="0.18" cy="0.55" r="0.75">
      <stop offset="0%"   stop-color="#4b7dff" stop-opacity="0.28"/>
      <stop offset="55%"  stop-color="#4b7dff" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="radarGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%"   stop-color="#56d8ff" stop-opacity="0.22"/>
      <stop offset="70%"  stop-color="#56d8ff" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#56d8ff" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#ffffff"/>
      <stop offset="55%"  stop-color="#cfe0ff"/>
      <stop offset="100%" stop-color="#8fb0ff"/>
    </linearGradient>

    <linearGradient id="wind" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#6f9dff" stop-opacity="0"/>
      <stop offset="35%"  stop-color="#8fb4ff" stop-opacity="0.85"/>
      <stop offset="75%"  stop-color="#b18cff" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#b18cff" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="scan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#9fd8ff" stop-opacity="0"/>
      <stop offset="50%"  stop-color="#9fd8ff" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#9fd8ff" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#56d8ff" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#56d8ff" stop-opacity="0"/>
    </linearGradient>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 H0 V40" fill="none" stroke="#7fa6ff" stroke-width="1" stroke-opacity="0.055"/>
    </pattern>

    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <!-- background -->
  <rect width="1280" height="360" fill="url(#sky)"/>
  <rect width="1280" height="360" fill="url(#grid)"/>
  <rect width="1280" height="360" fill="url(#glow)"/>

  <!-- wind currents -->
  <g fill="none" stroke="url(#wind)" stroke-linecap="round">
    <path d="M-80 96 C 180 46 330 148 560 112 S 980 44 1360 104" stroke-width="1.6" stroke-dasharray="360 900">
      <animate attributeName="stroke-dashoffset" from="1260" to="0" dur="11s" repeatCount="indefinite"/>
    </path>
    <path d="M-80 150 C 220 210 380 74 620 132 S 1010 210 1360 142" stroke-width="1.1" opacity="0.75" stroke-dasharray="280 1000">
      <animate attributeName="stroke-dashoffset" from="1280" to="0" dur="16s" repeatCount="indefinite"/>
    </path>
    <path d="M-80 268 C 200 220 420 316 660 268 S 1020 214 1360 276" stroke-width="1.3" opacity="0.6" stroke-dasharray="320 980">
      <animate attributeName="stroke-dashoffset" from="1300" to="0" dur="21s" repeatCount="indefinite"/>
    </path>
    <path d="M-80 322 C 260 286 470 350 700 322 S 1060 280 1360 320" stroke-width="1" opacity="0.35" stroke-dasharray="240 1100">
      <animate attributeName="stroke-dashoffset" from="1340" to="0" dur="27s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- drifting dust -->
  <g fill="#cfe0ff">
    <circle r="1.7" opacity="0.9">
      <animateMotion dur="14s" repeatCount="indefinite" path="M120 250 C 400 200 620 300 900 240"/>
      <animate attributeName="opacity" values="0;0.9;0" dur="14s" repeatCount="indefinite"/>
    </circle>
    <circle r="1.2" opacity="0.7">
      <animateMotion dur="19s" repeatCount="indefinite" path="M300 80 C 560 130 760 40 1080 96"/>
      <animate attributeName="opacity" values="0;0.7;0" dur="19s" repeatCount="indefinite"/>
    </circle>
    <circle r="1.4" opacity="0.6">
      <animateMotion dur="23s" repeatCount="indefinite" path="M60 310 C 380 270 640 340 1000 290"/>
      <animate attributeName="opacity" values="0;0.6;0" dur="23s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- full-height scan sweep -->
  <rect x="-140" y="0" width="140" height="360" fill="url(#scan)">
    <animate attributeName="x" values="-140;1320" dur="9s" repeatCount="indefinite"/>
  </rect>

  <!-- left column: name -->
  <g font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif">
    <text x="88" y="64" font-size="12.5" letter-spacing="5.5" fill="#5d739b">AUDITOR OF PIXELS</text>

    <text x="84" y="182" font-size="95" font-weight="800" letter-spacing="13" fill="url(#name)">ZEPHYR</text>

    <text x="88" y="226" font-size="19" letter-spacing="1.5" fill="#9fb4d8">西风之神 · 在像素之间追查伪造的证据</text>

    <g transform="translate(88,254)">
      <path d="M0 0 H96" stroke="#6f9dff" stroke-width="1.6" stroke-opacity="0.9"/>
      <path d="M0 0 H96" stroke="#b18cff" stroke-width="1.6" stroke-opacity="0.5" stroke-dasharray="6 10">
        <animate attributeName="stroke-dashoffset" from="0" to="-64" dur="3s" repeatCount="indefinite"/>
      </path>
    </g>

    <text x="88" y="288" font-size="13" letter-spacing="3.6" fill="#61748f">AI IMAGE FORENSICS &#183; MULTIMODAL AGENTS &#183; PYTHON / C++</text>

    <text x="88" y="340" font-size="10.5" letter-spacing="1.4" fill="#3b4a61">/home/zephyr · indexing evidence since 2025</text>
  </g>

  <!-- right column: radar -->
  <g transform="translate(1108 178)">
    <circle r="112" fill="url(#radarGlow)"/>
    <circle r="104" fill="none" stroke="#5b78a8" stroke-opacity="0.35" stroke-width="1"/>
    <circle r="74"  fill="none" stroke="#5b78a8" stroke-opacity="0.28" stroke-width="1" stroke-dasharray="3 7"/>
    <circle r="42"  fill="none" stroke="#5b78a8" stroke-opacity="0.22" stroke-width="1"/>
    <path d="M-104 0 H104 M0 -104 V104" stroke="#5b78a8" stroke-opacity="0.16" stroke-width="1"/>

    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="7s" repeatCount="indefinite"/>
      <path d="M0 0 L104 0" stroke="url(#sweep)" stroke-width="2"/>
      <path d="M0 0 L104 0 L0 0 Z" fill="url(#sweep)" fill-opacity="0.10"/>
    </g>

    <circle cx="46" cy="-38" r="3.1" fill="#56d8ff">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="3.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="-58" cy="26" r="2.4" fill="#b18cff">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="4.7s" begin="1.1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="22" cy="64" r="2.2" fill="#8fb4ff">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="5.9s" begin="2.3s" repeatCount="indefinite"/>
    </circle>

    <g font-family="'Segoe UI', system-ui, sans-serif" text-anchor="middle">
      <text y="132" font-size="10.5" letter-spacing="3.2" fill="#6c86ad">SCANNING · SYNTHETIC MEDIA</text>
    </g>
  </g>

  <!-- frame -->
  <rect x="0.5" y="0.5" width="1279" height="359" fill="none" stroke="#7fa6ff" stroke-opacity="0.16"/>
</svg>
