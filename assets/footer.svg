<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 140" width="1280" height="140" role="img" aria-label="Footer quote">
  <title>Footer</title>
  <defs>
    <linearGradient id="fg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#6f9dff" stop-opacity="0"/>
      <stop offset="20%"  stop-color="#8fb4ff" stop-opacity="0.55"/>
      <stop offset="80%"  stop-color="#b18cff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#b18cff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="ft" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#8ba2c8"/>
      <stop offset="50%"  stop-color="#dbe6ff"/>
      <stop offset="100%" stop-color="#9fb0d4"/>
    </linearGradient>
    <linearGradient id="fbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#0a1122"/>
      <stop offset="100%" stop-color="#05080f"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="140" fill="url(#fbg)"/>
  <path d="M0 1 H1280" stroke="url(#fg)" stroke-width="1"/>

  <g font-family="'Segoe UI', system-ui, -apple-system, 'Noto Sans SC', sans-serif" text-anchor="middle">
    <text x="640" y="58" font-size="21" letter-spacing="2" fill="url(#ft)">风不会留下痕迹，但证据会。</text>
    <text x="640" y="88" font-size="12" letter-spacing="3.2" fill="#586c8b">THE WIND LEAVES NO TRACE — THE EVIDENCE DOES.</text>
    <text x="640" y="120" font-size="10" letter-spacing="5" fill="#3a4a63">— ZEPHYR —</text>
  </g>
</svg>
